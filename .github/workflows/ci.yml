# Checks and the exact deployable payload are one retained execution. No
# credentials, provider calls or automatic promotion are granted by this job.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate of docs/remediation/METHOD.md section 7, in its order and with its
  # exact commands. `npm run gate` runs the same list locally; a builder runs it
  # before handover, and CI is the second opinion, never the first.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITEST_JSON: ${{ runner.temp }}/vitest.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: App typecheck
        run: node --max-old-space-size=4096 node_modules/typescript/bin/tsc --noEmit --incremental false --composite false
      - name: SDK typecheck
        run: node node_modules/typescript/bin/tsc -p src/sdk/tsconfig.json --noEmit
      # The score tool judges every later step, so its own proof runs first.
      - name: Score tool proof
        run: node --test scripts/remediation/score.test.mjs
      # The suite is red at the checkpoint baseline (ruling R3): the ratchet below
      # is the judge of RED TESTS, not this step's exit code. It fails on any
      # failing test absent from docs/remediation/baseline-failures.json, and that
      # list may only lose entries. When it reaches zero this flag goes with it.
      # A CRASHED suite does not slip past: the report lands in a fresh runner
      # temp directory each run, and the ratchet refuses a missing, unparseable,
      # empty or uncollected report rather than scoring it as zero failures.
      - name: Suite
        continue-on-error: true
        run: node node_modules/vitest/vitest.mjs run src --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile="$VITEST_JSON"
      - name: Ratchet
        run: node scripts/remediation/score.mjs --from "$VITEST_JSON" --check-ratchet
      # The typecheck state is an input, not a decoration: the two steps above
      # must have passed for this step to run at all.
      - name: Score
        run: node scripts/remediation/score.mjs --from "$VITEST_JSON" --check --typecheck green
      - name: Generated files
        run: |
          node scripts/build-sdk.mjs --check
          node scripts/build-meridian.mjs --check
      - run: npm run lint

  verified-package:
    runs-on: ubuntu-latest
    # Batch TOOLS owns removing this flag. The packager is retained history that
    # has never run against the remediation work; until batch TOOLS re-proves it
    # on this branch it reports, it does not block the gate above.
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The existing packager executes real lint, app/SDK noEmit and npm test,
      # retaining complete primaries and the same held source/config/tool basis.
      # SDK/Meridian comparison is write:false. Promotion never rebuilds.
      - name: Check and attest immutable package
        shell: bash
        run: |
          umask 077
          proof_dir="$(mktemp -d)"
          chmod 700 "$proof_dir"
          printf '%s' '{"profile":"ci-v1"}' > "$proof_dir/input.json"
          chmod 600 "$proof_dir/input.json"
          echo "PACKAGE_LOG=$proof_dir/package.log" >> "$GITHUB_ENV"
          echo "PACKAGE_NODE_PROOF=$proof_dir/node-tests.json" >> "$GITHUB_ENV"
          node scripts/stamp-workflow.mjs --mode package --input "$proof_dir/input.json" --output "$proof_dir/artifact.json" > "$proof_dir/package.log" 2>&1
          export STAMP_TEST_ARTIFACT_PATH="$proof_dir/artifact.json"
          # Node's test files are not Vitest suites. Reuse the exact validated
          # package through this test-only input; never build it recursively.
          echo "PACKAGE_ARTIFACT=$proof_dir/artifact.json" >> "$GITHUB_ENV"
          node --input-type=module -e 'import {verifyPackagedNodeTests,canonical} from "./scripts/stamp-workflow.mjs"; const proof=await verifyPackagedNodeTests(process.env.STAMP_TEST_ARTIFACT_PATH); console.log(canonical(proof)); if(proof.exitCode!==0||proof.signal||!proof.unchanged||!proof.artifactUnchanged)process.exitCode=1;' > "$proof_dir/node-tests.json"
      - name: Verify final upload identity
        shell: bash
        run: |
          node --input-type=module -e 'import {verifyPackagedUpload,canonical} from "./scripts/stamp-workflow.mjs"; console.log(canonical(await verifyPackagedUpload(process.env.PACKAGE_ARTIFACT,process.env.PACKAGE_NODE_PROOF)));'
          chmod 400 "$PACKAGE_ARTIFACT" "$PACKAGE_NODE_PROOF"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-package-${{ github.sha }}
          path: |
            ${{ env.PACKAGE_ARTIFACT }}
            ${{ env.PACKAGE_NODE_PROOF }}
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-package-diagnostics-${{ github.sha }}
          path: |
            ${{ env.PACKAGE_LOG }}
            ${{ env.PACKAGE_NODE_PROOF }}
          if-no-files-found: ignore
          retention-days: 30
