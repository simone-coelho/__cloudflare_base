<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="880" viewBox="0 0 1100 880" role="img" aria-labelledby="path-t path-d" lang="en-US" font-family="Roboto, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" fill="#08251A">
  <title id="path-t">From an event to a decision</title>
  <desc id="path-d">The steps, left to right, in a row for the visitor and a row for the slot, each with what governs it. The visitor: identity and session, where each visitor gets an anonymous id and a signed session, governed by Worker settings set by an engineer; the consent check, where without an explicit choice nothing is personalized or recorded, governed by the visitor's own choice; touches from the event, where the registry says which dimension values an event touches, and by how much; graded, fading interest, read for each value when the page asks, governed by the registry's memory settings; the regional prior, where a stranger leans on their region's interests, less as their own grow, governed by the learn document. The slot: gates, then pins, where only pieces that may be served remain and pinned pieces are reserved first, unscored, governed by the catalog and the slots document; each piece's score, where the rest score the sum of interest times the slot's weight over their tags, then adjustments, governed by the slots document; ranking and the cap, by score after the pins, capped where pieces share a value, governed by the slots document; the answer and its receipt, content ids in order with reasons while the receipt keeps the arithmetic, naming every document in force by revision; outcomes and the dial, where it records what works from the first day and changes nothing until the brand turns the dial, governed by the learn document. No step here calls an AI model to decide.</desc>
  <!-- Lane D1, drawn by hand, version 2 (docs/enablement/LANE-BRIEF-V2.md): the finished product, with no labels or legend.
       Facts: research/S2-engine-facts.md section 3 (3.1 to 3.15), 4.2, 4.6, 6.1; research/S5-product-as-designed.md rows A1, A3,
       V1, V2, V4, V6, C1, C3, C7, F1, F3, F7. Order follows S2: identity before consent (3.1, 3.2); the regional prior before
       scoring (3.6, 3.7, 3.11); gates, then pins reserved before any score (3.9, 3.10), then the score and the ranking with the
       diversity cap (3.11, 3.12). The learning sentence is V2 section 3's. No figure appears in the drawing. -->
  <defs>
    <marker id="path-head" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#08251A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="880" fill="#FFFFFF"/>

  <text x="20" y="48" font-size="32" font-weight="700">From an event to a decision</text>
  <text x="20" y="80" font-size="20" fill="#197050">In smaller type under each step: what governs it.</text>

  <!-- Row one: the visitor -->
  <text x="20" y="124" font-size="19" font-weight="700" fill="#197050">The visitor: who they are, and what interests them</text>

  <!-- S2 3.1; 4.6 (identity settings are worker settings); S5 V12 -->
  <g data-box="identity">
    <rect x="20" y="140" width="196" height="291" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <path d="M20,371 h196 v48 a12,12 0 0 1 -12,12 h-172 a12,12 0 0 1 -12,-12 z" fill="#E4F0DA"/>
    <rect x="20" y="140" width="196" height="291" rx="12" fill="none" stroke="#08251A" stroke-width="2"/>
    <text x="34" y="172" font-size="22" font-weight="700">Identity and</text>
    <text x="34" y="198" font-size="22" font-weight="700">session</text>
    <text x="34" y="230" font-size="20">Each visitor gets</text>
    <text x="34" y="255" font-size="20">an anonymous id</text>
    <text x="34" y="280" font-size="20">and a signed</text>
    <text x="34" y="305" font-size="20">session.</text>
    <text x="34" y="395" font-size="18" font-weight="500" fill="#197050">Worker settings,</text>
    <text x="34" y="417" font-size="18" font-weight="500" fill="#197050">set by an engineer</text>
  </g>

  <!-- S2 3.2; S5 A1 -->
  <g data-box="consent">
    <rect x="236" y="140" width="196" height="291" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <path d="M236,371 h196 v48 a12,12 0 0 1 -12,12 h-172 a12,12 0 0 1 -12,-12 z" fill="#E4F0DA"/>
    <rect x="236" y="140" width="196" height="291" rx="12" fill="none" stroke="#08251A" stroke-width="2"/>
    <text x="250" y="172" font-size="22" font-weight="700">The consent</text>
    <text x="250" y="198" font-size="22" font-weight="700">check</text>
    <text x="250" y="230" font-size="20">Without an</text>
    <text x="250" y="255" font-size="20">explicit choice,</text>
    <text x="250" y="280" font-size="20">nothing is</text>
    <text x="250" y="305" font-size="20">personalized or</text>
    <text x="250" y="330" font-size="20">recorded.</text>
    <text x="250" y="395" font-size="18" font-weight="500" fill="#197050">The visitor's own</text>
    <text x="250" y="417" font-size="18" font-weight="500" fill="#197050">choice</text>
  </g>

  <!-- S2 3.3, items 4-7; 4.2; S5 B1, V1, V2 -->
  <g data-box="touches">
    <rect x="452" y="140" width="196" height="291" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <path d="M452,371 h196 v48 a12,12 0 0 1 -12,12 h-172 a12,12 0 0 1 -12,-12 z" fill="#E4F0DA"/>
    <rect x="452" y="140" width="196" height="291" rx="12" fill="none" stroke="#08251A" stroke-width="2"/>
    <text x="466" y="172" font-size="22" font-weight="700">Touches from</text>
    <text x="466" y="198" font-size="22" font-weight="700">the event</text>
    <text x="466" y="230" font-size="20">The registry says</text>
    <text x="466" y="255" font-size="20">which dimension</text>
    <text x="466" y="280" font-size="20">values an event</text>
    <text x="466" y="305" font-size="20">touches, and by</text>
    <text x="466" y="330" font-size="20">how much.</text>
    <text x="466" y="395" font-size="18" font-weight="500" fill="#197050">The registry</text>
  </g>

  <!-- S2 3.4 (graded, fading, computed when read); 3.7; 3.17; S5 V2 -->
  <g data-box="interest">
    <rect x="668" y="140" width="196" height="291" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <path d="M668,371 h196 v48 a12,12 0 0 1 -12,12 h-172 a12,12 0 0 1 -12,-12 z" fill="#E4F0DA"/>
    <rect x="668" y="140" width="196" height="291" rx="12" fill="none" stroke="#08251A" stroke-width="2"/>
    <text x="682" y="172" font-size="22" font-weight="700">Graded, fading</text>
    <text x="682" y="198" font-size="22" font-weight="700">interest</text>
    <text x="682" y="230" font-size="20">When the page</text>
    <text x="682" y="255" font-size="20">asks: graded for</text>
    <text x="682" y="280" font-size="20">each value, and</text>
    <text x="682" y="305" font-size="20">fading with time.</text>
    <text x="682" y="395" font-size="18" font-weight="500" fill="#197050">The registry's</text>
    <text x="682" y="417" font-size="18" font-weight="500" fill="#197050">memory settings</text>
  </g>

  <!-- S2 3.6 (the blend); 3.7; S5 A3, M2 -->
  <g data-box="regional prior">
    <rect x="884" y="140" width="196" height="291" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <path d="M884,371 h196 v48 a12,12 0 0 1 -12,12 h-172 a12,12 0 0 1 -12,-12 z" fill="#E4F0DA"/>
    <rect x="884" y="140" width="196" height="291" rx="12" fill="none" stroke="#08251A" stroke-width="2"/>
    <text x="898" y="172" font-size="22" font-weight="700">The regional</text>
    <text x="898" y="198" font-size="22" font-weight="700">prior</text>
    <text x="898" y="230" font-size="20">A stranger leans</text>
    <text x="898" y="255" font-size="20">on their region's</text>
    <text x="898" y="280" font-size="20">interests, less as</text>
    <text x="898" y="305" font-size="20">their own grow.</text>
    <text x="898" y="395" font-size="18" font-weight="500" fill="#197050">The learn</text>
    <text x="898" y="417" font-size="18" font-weight="500" fill="#197050">document</text>
  </g>

  <!-- The chain, then the return to row two -->
  <g stroke="#08251A" stroke-width="3" fill="none">
    <line x1="217" y1="185" x2="223" y2="185" marker-end="url(#path-head)"/>
    <line x1="433" y1="185" x2="439" y2="185" marker-end="url(#path-head)"/>
    <line x1="649" y1="185" x2="655" y2="185" marker-end="url(#path-head)"/>
    <line x1="865" y1="185" x2="871" y2="185" marker-end="url(#path-head)"/>
    <path d="M982,432 V453 H118 V489" stroke-linejoin="round" marker-end="url(#path-head)"/>
    <line x1="217" y1="546" x2="223" y2="546" marker-end="url(#path-head)"/>
    <line x1="433" y1="546" x2="439" y2="546" marker-end="url(#path-head)"/>
    <line x1="649" y1="546" x2="655" y2="546" marker-end="url(#path-head)"/>
    <line x1="865" y1="546" x2="871" y2="546" marker-end="url(#path-head)"/>
  </g>

  <!-- Row two: the slot -->
  <text x="140" y="485" font-size="19" font-weight="700" fill="#197050">The slot: what may be served, in what order, and what is kept</text>

  <!-- S2 3.9 (eligibility), 3.10 (off-limits, exclusions, pins reserved before any ranking); S5 C1, C2 -->
  <g data-box="gates">
    <rect x="20" y="501" width="196" height="291" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <path d="M20,732 h196 v48 a12,12 0 0 1 -12,12 h-172 a12,12 0 0 1 -12,-12 z" fill="#E4F0DA"/>
    <rect x="20" y="501" width="196" height="291" rx="12" fill="none" stroke="#08251A" stroke-width="2"/>
    <text x="34" y="533" font-size="22" font-weight="700">Gates, then</text>
    <text x="34" y="559" font-size="22" font-weight="700">pins</text>
    <text x="34" y="591" font-size="20">Only pieces that</text>
    <text x="34" y="616" font-size="20">may be served;</text>
    <text x="34" y="641" font-size="20">pinned pieces are</text>
    <text x="34" y="666" font-size="20">reserved first,</text>
    <text x="34" y="691" font-size="20">unscored.</text>
    <text x="34" y="756" font-size="18" font-weight="500" fill="#197050">The catalog and</text>
    <text x="34" y="778" font-size="18" font-weight="500" fill="#197050">the slots document</text>
  </g>

  <!-- S2 3.11 (the base sum, then completes, seeds, stage fit, freshness, fatigue, merchandising and the lift); S5 C3, C5 -->
  <g data-box="score">
    <rect x="236" y="501" width="196" height="291" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <path d="M236,732 h196 v48 a12,12 0 0 1 -12,12 h-172 a12,12 0 0 1 -12,-12 z" fill="#E4F0DA"/>
    <rect x="236" y="501" width="196" height="291" rx="12" fill="none" stroke="#08251A" stroke-width="2"/>
    <text x="250" y="533" font-size="22" font-weight="700">Each piece's</text>
    <text x="250" y="559" font-size="22" font-weight="700">score</text>
    <text x="250" y="591" font-size="20">The rest: the sum</text>
    <text x="250" y="616" font-size="20">of interest × the</text>
    <text x="250" y="641" font-size="20">slot's weight over</text>
    <text x="250" y="666" font-size="20">its tags, then</text>
    <text x="250" y="691" font-size="20">adjustments.</text>
    <text x="250" y="756" font-size="18" font-weight="500" fill="#197050">The slots</text>
    <text x="250" y="778" font-size="18" font-weight="500" fill="#197050">document</text>
  </g>

  <!-- S2 3.12 (sorted by score; the diversity cap); S5 V4, V6 -->
  <g data-box="ranking">
    <rect x="452" y="501" width="196" height="291" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <path d="M452,732 h196 v48 a12,12 0 0 1 -12,12 h-172 a12,12 0 0 1 -12,-12 z" fill="#E4F0DA"/>
    <rect x="452" y="501" width="196" height="291" rx="12" fill="none" stroke="#08251A" stroke-width="2"/>
    <text x="466" y="533" font-size="22" font-weight="700">Ranking and</text>
    <text x="466" y="559" font-size="22" font-weight="700">the cap</text>
    <text x="466" y="591" font-size="20">By score, after</text>
    <text x="466" y="616" font-size="20">the pins, capped</text>
    <text x="466" y="641" font-size="20">where pieces</text>
    <text x="466" y="666" font-size="20">share a value.</text>
    <text x="466" y="756" font-size="18" font-weight="500" fill="#197050">The slots</text>
    <text x="466" y="778" font-size="18" font-weight="500" fill="#197050">document</text>
  </g>

  <!-- S2 3.14 (the receipt and what it names); 3.15; S5 F1 -->
  <g data-box="answer">
    <rect x="668" y="501" width="196" height="291" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <path d="M668,732 h196 v48 a12,12 0 0 1 -12,12 h-172 a12,12 0 0 1 -12,-12 z" fill="#E4F0DA"/>
    <rect x="668" y="501" width="196" height="291" rx="12" fill="none" stroke="#08251A" stroke-width="2"/>
    <text x="682" y="533" font-size="22" font-weight="700">Answer and</text>
    <text x="682" y="559" font-size="22" font-weight="700">receipt</text>
    <text x="682" y="591" font-size="20">Content ids in</text>
    <text x="682" y="616" font-size="20">order, with</text>
    <text x="682" y="641" font-size="20">reasons; the</text>
    <text x="682" y="666" font-size="20">receipt keeps the</text>
    <text x="682" y="691" font-size="20">arithmetic.</text>
    <text x="682" y="756" font-size="18" font-weight="500" fill="#197050">Every document in</text>
    <text x="682" y="778" font-size="18" font-weight="500" fill="#197050">force, by revision</text>
  </g>

  <!-- S2 3.13; 3.15 (outcomes and attribution); 5.1, 5.2; S5 F3, F7; the learning sentence of V2 section 3 -->
  <g data-box="outcomes">
    <rect x="884" y="501" width="196" height="291" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <path d="M884,732 h196 v48 a12,12 0 0 1 -12,12 h-172 a12,12 0 0 1 -12,-12 z" fill="#E4F0DA"/>
    <rect x="884" y="501" width="196" height="291" rx="12" fill="none" stroke="#08251A" stroke-width="2"/>
    <text x="898" y="533" font-size="22" font-weight="700">Outcomes and</text>
    <text x="898" y="559" font-size="22" font-weight="700">the dial</text>
    <text x="898" y="591" font-size="20">It records what</text>
    <text x="898" y="616" font-size="20">works from the</text>
    <text x="898" y="641" font-size="20">first day and</text>
    <text x="898" y="666" font-size="20">changes nothing</text>
    <text x="898" y="691" font-size="20">until the brand</text>
    <text x="898" y="716" font-size="20">turns the dial.</text>
    <text x="898" y="756" font-size="18" font-weight="500" fill="#197050">The learn</text>
    <text x="898" y="778" font-size="18" font-weight="500" fill="#197050">document</text>
  </g>

  <!-- The rule (S2 6.1; V2 section 3) -->
  <g data-box="rule">
    <rect x="20" y="812" width="1060" height="48" rx="24" fill="#08251A"/>
    <text x="550" y="843" font-size="21" font-weight="700" fill="#ABFF44" text-anchor="middle">No step here calls an AI model to decide.</text>
  </g>
</svg>
