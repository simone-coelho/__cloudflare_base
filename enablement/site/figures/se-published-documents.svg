    <path d="M20,328 a12,12 0 0 1 12,-12 h226 a12,12 0 0 1 12,12 v36 h-250 z" fill="#E4F0DA"/>
    <rect x="20" y="316" width="250" height="276" rx="12" fill="none" stroke="#08251A" stroke-width="2"/>
    <text x="36" y="349" font-size="22" font-weight="700">Registry</text>
    <text x="36" y="398" font-size="19">dimensions, and the</text>
    <text x="36" y="421" font-size="19">attribute each reads</text>
    <text x="36" y="452" font-size="19">action weights</text>
    <text x="36" y="483" font-size="19">memory τ: 14 days by</text>
    <text x="36" y="506" font-size="19">default, at most 90</text>
    <text x="36" y="537" font-size="19">K 1.8; entry line 0.60,</text>
    <text x="36" y="560" font-size="19">exit line 0.45</text>
  </g>
  <g data-box="catalog">
    <rect x="290" y="316" width="250" height="276" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <path d="M290,328 a12,12 0 0 1 12,-12 h226 a12,12 0 0 1 12,12 v36 h-250 z" fill="#E4F0DA"/>
    <rect x="290" y="316" width="250" height="276" rx="12" fill="none" stroke="#08251A" stroke-width="2"/>
    <text x="306" y="349" font-size="22" font-weight="700">Catalog</text>
    <text x="306" y="398" font-size="19">pieces, by the brand's</text>
    <text x="306" y="421" font-size="19">own ids</text>
    <text x="306" y="452" font-size="19">tags in the registry's</text>
    <text x="306" y="475" font-size="19">vocabulary</text>
    <text x="306" y="506" font-size="19">windows, rules, stock</text>
    <text x="306" y="537" font-size="19">merchandising signals</text>
  </g>
  <g data-box="slots">
    <rect x="560" y="316" width="250" height="276" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <path d="M560,328 a12,12 0 0 1 12,-12 h226 a12,12 0 0 1 12,12 v36 h-250 z" fill="#E4F0DA"/>
    <rect x="560" y="316" width="250" height="276" rx="12" fill="none" stroke="#08251A" stroke-width="2"/>
    <text x="576" y="349" font-size="22" font-weight="700">Slots</text>
    <text x="576" y="398" font-size="19">each slot's take and</text>
    <text x="576" y="421" font-size="19">weights</text>
    <text x="576" y="452" font-size="19">pins, exclusions, the cap</text>
    <text x="576" y="483" font-size="19">journey-stage rule,</text>
    <text x="576" y="506" font-size="19">freshness, fatigue</text>
    <text x="576" y="537" font-size="19">merchandising weights,</text>
    <text x="576" y="560" font-size="19">arrival seeds</text>
  </g>
  <g data-box="learn">
    <rect x="830" y="316" width="250" height="276" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <path d="M830,328 a12,12 0 0 1 12,-12 h226 a12,12 0 0 1 12,12 v36 h-250 z" fill="#E4F0DA"/>
    <rect x="830" y="316" width="250" height="276" rx="12" fill="none" stroke="#08251A" stroke-width="2"/>
    <text x="846" y="349" font-size="22" font-weight="700">Learn</text>
    <text x="846" y="398" font-size="19">the learning dial for</text>
    <text x="846" y="421" font-size="19">each slot: 0 by default</text>
    <text x="846" y="452" font-size="19">the holdout</text>
    <text x="846" y="483" font-size="19">the regional prior: k = 1</text>
    <text x="846" y="514" font-size="19">attribution windows</text>
    <text x="846" y="545" font-size="19">exploration: off by</text>
    <text x="846" y="568" font-size="19">default</text>
  </g>

  <!-- the engine reads one coherent set (S2 4.1, "Serving reads") -->
  <g stroke="#08251A" stroke-width="3" marker-end="url(#sepd-head)">
    <line x1="550" y1="594" x2="550" y2="620"/>
  </g>
  <text x="566" y="620" font-size="19" font-weight="500" fill="#197050">the engine reads one coherent set for each decision</text>

  <!-- every revision kept (S2 4.1); what needs an engineer (S2 4.6) -->
  <g data-box="revisions">
    <rect x="20" y="640" width="620" height="164" rx="12" fill="#08251A" stroke="#08251A" stroke-width="2"/>
    <text x="36" y="674" font-size="22" font-weight="700" fill="#ABFF44">Every revision kept</text>
    <text x="36" y="704" font-size="19" fill="#FFFFFF">Each save records who changed it and why; a rollback</text>
    <text x="36" y="728" font-size="19" fill="#FFFFFF">writes the old value forward as a new revision; every</text>
    <text x="36" y="752" font-size="19" fill="#FFFFFF">receipt names the revisions in force.</text>
    <text x="36" y="776" font-size="19" fill="#FFFFFF">A change is in force without a software release.</text>
  </g>
  <g data-box="settings">
    <rect x="660" y="640" width="420" height="164" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <text x="676" y="674" font-size="22" font-weight="700">The deployment's settings</text>
    <text x="676" y="704" font-size="19">Engineers set tenants, site keys, allowed</text>
    <text x="676" y="728" font-size="19">origins, identity secrets and retention;</text>
    <text x="676" y="752" font-size="19">no document change needs an engineer.</text>
