<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="824" viewBox="0 0 1100 824" role="img" aria-labelledby="sepd-t sepd-d" lang="en-US" font-family="Roboto, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" fill="#08251A">
  <title id="sepd-t">How the engine is configured</title>
  <desc id="sepd-d">At the top, two ways in. The console: the brand's team signs in to change weights, memory, lines, slot rules, pins, seeds, learning dials and the holdout, and to read what has been learned, receipts, the day report and the history of every document. The API: the brand's developers make every change the console makes, and also change the catalog, the dimensions and the attribute each reads. A publish is validated whole and kept as a new revision. In the middle, the four published documents. The registry: the dimensions and the attribute each reads, the action weights, the memory tau, 14 days by default and at most 90, K of 1.8, and the entry and exit lines at 0.60 and 0.45. The catalog: the pieces by the brand's own ids, their tags in the registry's vocabulary, their windows, rules and stock, and their merchandising signals. The slots document: each slot's take and weights, its pins, exclusions and cap, its journey-stage rule, freshness and fatigue, its merchandising weights and its arrival seeds. The learn document: the learning dial for each slot, 0 by default, the holdout, the regional prior with its blend constant of 1, the attribution windows, and exploration, off by default. The engine reads one coherent set of them for each decision. At the foot, every revision is kept: each save records who changed it and why, a rollback writes the old value forward as a new revision, every receipt names the revisions in force, and a change is in force without a software release. Beside it, the deployment's own settings: engineers set tenants, site keys, allowed origins, identity secrets and retention periods, and no document change needs an engineer.</desc>
  <!-- Lane G1, drawn by hand for docs/enablement/LANE-BRIEF-V3.md section 4.5, item 4. Facts: research/S2-engine-facts.md 3.17
       (the defaults), 4.1 (the publication set, revisions, rollback), 4.2 (what each document holds), 4.5 (the console) and
       4.6 (what needs no deploy, and what needs an engineer); the Vantage facts sheet (FACTS.md) section 10 (the knobs).
       Glossary: published documents, registry, catalog, slots document, learn document, revision, console. -->
  <defs>
    <marker id="sepd-head" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#08251A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="824" fill="#FFFFFF"/>

  <text x="20" y="48" font-size="32" font-weight="700">How the engine is configured</text>
  <text x="20" y="82" font-size="20" fill="#197050">Four published documents, changed in the console or through the API, with every revision kept.</text>

  <!-- the two ways in (S2 4.4, 4.5; the console's views) -->
  <g data-box="console">
