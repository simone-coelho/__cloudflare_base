    <text x="36" y="142" font-size="22" font-weight="700">The console</text>
    <text x="36" y="174" font-size="19">The brand's team signs in to change weights, memory,</text>
    <text x="36" y="198" font-size="19">lines, slot rules, pins, seeds, learning dials and the</text>
    <text x="36" y="222" font-size="19">holdout, and to read what has been learned, receipts,</text>
    <text x="36" y="246" font-size="19">the day report and every document's history.</text>
  </g>
  <g data-box="api">
    <rect x="560" y="108" width="520" height="160" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <text x="576" y="142" font-size="22" font-weight="700">The API</text>
    <text x="576" y="174" font-size="19">The brand's developers make every change the</text>
    <text x="576" y="198" font-size="19">console makes, and also change the catalog, the</text>
    <text x="576" y="222" font-size="19">dimensions and the attribute each reads.</text>
  </g>

  <!-- a publish -->
  <g stroke="#08251A" stroke-width="3" marker-end="url(#sepd-head)">
    <line x1="280" y1="270" x2="280" y2="296"/>
    <line x1="820" y1="270" x2="820" y2="296"/>
  </g>
  <text x="550" y="296" font-size="19" font-weight="500" text-anchor="middle" fill="#197050">a publish: validated whole, kept as a new revision</text>

  <!-- the four published documents (S2 4.2; defaults S2 3.17) -->
  <g data-box="registry">
