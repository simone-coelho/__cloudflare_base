    <text x="560" y="1162">a test on</text>
    <text x="560" y="1183">any slot</text>
    <text x="905" y="1162" text-anchor="end">decisions and</text>
    <text x="905" y="1183" text-anchor="end">outcomes</text>
  </g>
  <g data-box="odp">
    <rect x="20" y="1200" width="330" height="124" rx="16" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
    <text x="40" y="1232" font-size="23" font-weight="700">ODP</text>
    <text x="40" y="1259" font-size="20">Lasting memory of events</text>
    <text x="40" y="1284" font-size="20">and audiences; decisions</text>
