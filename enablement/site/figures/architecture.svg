    <text x="42" y="186" font-size="20">The customer's page and the engine's</text>
    <text x="42" y="213" font-size="20">script, in the visitor's browser. The</text>
    <text x="42" y="240" font-size="20">page paints each answer: the brand's</text>
    <text x="42" y="267" font-size="20">own content ids in order, each with</text>
    <text x="42" y="294" font-size="20">its reasons.</text>
  </g>

  <!-- Opal, backstage with the brand's team, never in a live decision (S5 B10, F14, C8; glossary "Opal") -->
  <g data-box="opal">
    <rect x="470" y="120" width="220" height="210" rx="16" fill="#197050"/>
    <text x="488" y="154" font-size="21" font-weight="700" fill="#FFFFFF">Opal, backstage</text>
    <text x="488" y="186" font-size="20" fill="#FFFFFF">In plain words, the</text>
    <text x="488" y="211" font-size="20" fill="#FFFFFF">team asks; Opal</text>
    <text x="488" y="236" font-size="20" fill="#FFFFFF">authors, tags and</text>
    <text x="488" y="261" font-size="20" fill="#FFFFFF">explains, never in</text>
    <text x="488" y="286" font-size="20" fill="#FFFFFF">a live decision.</text>
  </g>

