    <text x="744" y="154" font-size="22" font-weight="700">The operator, in the console</text>
    <text x="744" y="184" font-size="20">Publishes the documents</text>
    <text x="744" y="209" font-size="20">and reads the outputs:</text>
    <g data-box="receipts">
