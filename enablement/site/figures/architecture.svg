    <text x="770" y="1232" font-size="23" font-weight="700">The brand's warehouse</text>
    <text x="770" y="1259" font-size="20">Every decision and outcome,</text>
    <text x="770" y="1284" font-size="20">on a cadence the brand sets.</text>
