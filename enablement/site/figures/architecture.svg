      <path d="M882,222 v16 h16" fill="none" stroke="#08251A" stroke-width="2"/>
      <text x="758" y="246" font-size="21" font-weight="700">Receipts</text>
      <text x="758" y="269" font-size="20">the arithmetic</text>
      <text x="758" y="291" font-size="20">behind each</text>
      <text x="758" y="313" font-size="20">served piece</text>
    </g>
    <g data-box="day report">
      <path data-container="1" d="M912,222 h138 l16,16 v84 h-154 z" fill="#E4F0DA" stroke="#08251A" stroke-width="2"/>
      <path d="M1050,222 v16 h16" fill="none" stroke="#08251A" stroke-width="2"/>
      <text x="926" y="246" font-size="21" font-weight="700">Day report</text>
      <text x="926" y="269" font-size="20">outcomes</text>
      <text x="926" y="291" font-size="20">credited, slot</text>
      <text x="926" y="313" font-size="20">by slot</text>
    </g>
  </g>

  <!-- The team asks Opal; Opal has no arrow into Cloudflare -->
  <g stroke="#08251A" stroke-width="3" fill="none">
    <line x1="702" y1="225" x2="712" y2="225" marker-start="url(#arch-tail)" marker-end="url(#arch-head)"/>
  </g>

