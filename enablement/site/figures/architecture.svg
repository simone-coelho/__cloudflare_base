<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1340" viewBox="0 0 1100 1340" role="img" aria-labelledby="arch-t arch-d" lang="en-US" font-family="Roboto, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" fill="#08251A">
  <title id="arch-t">Where the engine runs on Cloudflare</title>
  <desc id="arch-d">The engine calls no AI model to decide. Opal is where people ask and generative AI creates, and that is where credits apply. The customer's site, in the visitor's browser, sends a consent choice, events and decision requests to the Worker on Cloudflare's network, and receives the answer: the brand's own content ids in order, each with its reasons. The operator, in the console, publishes the documents and reads the receipts and the day report. Opal works backstage with the brand's team, authoring, tagging and explaining, and never takes part in a live decision. The Worker, the engine's code, runs at the edge, in the data center nearest the visitor. Kept by each Worker: the visitor's objects (their consent choice and the pieces served to them), the learning statistics (one per slot), the regional prior (one per region, with no visitor ids) and the queue to the ledger. Each deployment's own storage: the visitor's interest in the key-value store, the published snapshots of the regional prior and the learned lift, the published documents in file storage beside the ledger and the day reports, and the database of operator accounts. The Worker links with ODP, which keeps events and audiences as lasting memory and returns a returning visitor's interests, with Feature Experimentation for a test on any slot, and with the brand's warehouse, which receives every decision and outcome.</desc>
  <!-- Lane D1, drawn by hand, version 2 (docs/enablement/LANE-BRIEF-V2.md): the finished product, with no labels or legend.
       Facts: research/S2-engine-facts.md 2.1-2.7, 3.14-3.16, 4.1-4.5, 7.3-7.5; research/S5-product-as-designed.md rows A8, B9,
       B10, C7, C8, C9, F1, F5, F6, F16. Palette: enablement/site/index.html (fir 08251A, light fir 197050, LF green ABFF44,
       neutral 3 E4F0DA). Fir is the engine, light fir is Opal. Presentation attributes only: no style element or attribute,
       no script and no external reference. -->
  <defs>
    <marker id="arch-head" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#08251A"/>
    </marker>
    <marker id="arch-tail" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#08251A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="1340" fill="#FFFFFF"/>

  <text x="20" y="46" font-size="32" font-weight="700">Where the engine runs on Cloudflare</text>
  <!-- V2 section 3, the AI sentence, verbatim -->
  <text x="20" y="78" font-size="19" font-weight="700">The engine calls no AI model to decide.</text>
  <text x="20" y="102" font-size="19">Opal is where people ask and generative AI creates, and that is where credits apply.</text>

