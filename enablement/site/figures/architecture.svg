    <text x="712" y="626" font-size="20" font-weight="700" fill="#197050">Each deployment's own storage</text>
    <g data-box="interest record">
      <rect x="708" y="640" width="344" height="96" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
      <text x="726" y="670" font-size="23" font-weight="700">The visitor's interest</text>
      <text x="726" y="697" font-size="20">In the key-value store: updated</text>
      <text x="726" y="723" font-size="20">by events, read by decisions.</text>
    </g>
    <g data-box="snapshots">
      <rect x="708" y="748" width="344" height="96" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
      <text x="726" y="778" font-size="23" font-weight="700">Published snapshots</text>
      <text x="726" y="805" font-size="20">Copies of the regional prior and</text>
      <text x="726" y="831" font-size="20">the learned lift, ready to read.</text>
    </g>
    <g data-box="published documents">
      <rect x="708" y="856" width="344" height="119" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
      <text x="726" y="886" font-size="23" font-weight="700">The published documents</text>
      <text x="726" y="913" font-size="20">In file storage: every revision</text>
      <text x="726" y="939" font-size="20">kept, beside the ledger and</text>
      <text x="726" y="965" font-size="20">the day reports.</text>
    </g>
