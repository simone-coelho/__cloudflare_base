    <text x="600" y="452" font-size="22" font-weight="700" text-anchor="middle">Cloudflare's network</text>
  </g>

  <!-- What crosses between the site, the operator and the Worker (S2 2.7 arrows 2, 3, 7, 16, 17) -->
  <g stroke="#08251A" stroke-width="3" fill="none">
    <line x1="46" y1="330" x2="46" y2="458" marker-end="url(#arch-head)"/>
    <line x1="160" y1="330" x2="160" y2="458" marker-end="url(#arch-head)"/>
    <line x1="262" y1="330" x2="262" y2="458" marker-end="url(#arch-head)"/>
    <line x1="374" y1="470" x2="374" y2="342" marker-end="url(#arch-head)"/>
    <line x1="760" y1="330" x2="760" y2="458" marker-end="url(#arch-head)"/>
    <line x1="930" y1="470" x2="930" y2="342" marker-end="url(#arch-head)"/>
  </g>
  <g font-size="19" font-weight="500">
    <text x="56" y="362">a consent</text>
    <text x="56" y="384">choice</text>
    <text x="170" y="362">an event</text>
    <text x="272" y="362">a decision</text>
    <text x="272" y="384">request</text>
    <text x="384" y="362">the answer</text>
    <text x="770" y="362">a publish,</text>
    <text x="770" y="384">a new revision</text>
    <text x="940" y="362">receipts and</text>
    <text x="940" y="384">the day report</text>
  </g>

  <!-- The Worker, the engine's code: its top faces the site and the console, its stem the storage, its foot the brand's systems
       (S2 0; 2.1, the three entry points; 2.4; 3.2; 3.14-3.15; S5 A8) -->
  <rect x="543" y="570" width="14" height="554" fill="#08251A"/>
  <rect x="106" y="1110" width="823" height="14" fill="#08251A"/>
  <g data-box="worker">
    <rect x="36" y="470" width="1028" height="108" rx="14" fill="#08251A"/>
    <text x="58" y="506" font-size="23" font-weight="700" fill="#ABFF44">The Worker: the engine's code</text>
    <text x="58" y="536" font-size="20" fill="#FFFFFF">Runs at the edge: the data center nearest the visitor. Checks access and consent, updates their interest,</text>
    <text x="58" y="562" font-size="20" fill="#FFFFFF">decides and keeps a receipt. The same code drains the queue into the ledger and runs the scheduled jobs.</text>
  </g>

  <!-- Kept by each Worker: its object classes and its queue (S2 2.2 EVENT_QUEUE; 2.3 and its closing paragraph) -->
  <g data-box="zone worker">
    <rect x="36" y="598" width="368" height="496" rx="18" fill="none" stroke="#197050" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="52" y="626" font-size="20" font-weight="700" fill="#197050">Kept by each Worker</text>
    <g data-box="visitor objects">
      <rect x="48" y="640" width="344" height="96" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
      <text x="66" y="670" font-size="23" font-weight="700">The visitor's objects</text>
      <text x="66" y="697" font-size="20">Their consent choice, and the</text>
      <text x="66" y="723" font-size="20">pieces served to them.</text>
    </g>
    <g data-box="learning statistics">
      <rect x="48" y="748" width="344" height="96" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
      <text x="66" y="778" font-size="23" font-weight="700">Learning statistics</text>
      <text x="66" y="805" font-size="20">One per slot: pieces shown and</text>
      <text x="66" y="831" font-size="20">outcomes credited, by context.</text>
    </g>
    <g data-box="regional prior">
      <rect x="48" y="856" width="344" height="96" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
      <text x="66" y="886" font-size="23" font-weight="700">The regional prior</text>
      <text x="66" y="913" font-size="20">One per region: interest counts,</text>
      <text x="66" y="939" font-size="20">with no visitor ids.</text>
    </g>
    <g data-box="queue">
      <rect x="48" y="984" width="344" height="96" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
      <text x="66" y="1014" font-size="23" font-weight="700">Queue to the ledger</text>
      <text x="66" y="1041" font-size="20">Receipts and outcomes, after the</text>
      <text x="66" y="1067" font-size="20">answer, with tracking consent.</text>
    </g>
  </g>

  <!-- Each deployment's own storage (S2 2.2; 2.5 REFLEX_HOST; 4.1; 4.3; 8.1; S5 C7, C9) -->
