  <g font-size="19" font-weight="500" text-anchor="middle">
    <text x="468" y="664">consent;</text>
    <text x="468" y="685">pieces served</text>
    <text x="468" y="797">pieces shown</text>
    <text x="468" y="888">each event's</text>
    <text x="468" y="909">touches</text>
    <text x="468" y="1016">receipts and</text>
