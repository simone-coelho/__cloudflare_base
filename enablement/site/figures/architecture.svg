      <rect x="708" y="984" width="344" height="96" rx="12" fill="#FFFFFF" stroke="#08251A" stroke-width="2"/>
      <text x="726" y="1014" font-size="23" font-weight="700">Database</text>
      <text x="726" y="1041" font-size="20">Operator accounts, permissions</text>
      <text x="726" y="1067" font-size="20">and the audit trail.</text>
    </g>
  </g>

