    <line x1="543" y1="806" x2="404" y2="806" marker-end="url(#arch-head)"/>
    <line x1="543" y1="918" x2="404" y2="918" marker-end="url(#arch-head)"/>
    <line x1="543" y1="1046" x2="404" y2="1046" marker-end="url(#arch-head)"/>
    <line x1="569" y1="694" x2="696" y2="694" marker-start="url(#arch-tail)" marker-end="url(#arch-head)"/>
    <line x1="708" y1="806" x2="569" y2="806" marker-end="url(#arch-head)"/>
