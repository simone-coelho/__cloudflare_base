name = "edge-platform"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]


# KV Namespaces
[[kv_namespaces]]
binding = "CACHE"
id = "c1f778bad6664b638ed4138ab2e2dd5c"
preview_id = "c35f8387e71349368b2c86e27f49961e"

[[kv_namespaces]]
binding = "SESSIONS"
id = "5f66b8f1e47747e5a17242f385afa72e"
preview_id = "6dfb454734464e608b9d204521e9387b"

# R2 Buckets
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "edge-platform-storage"
preview_bucket_name = "edge-platform-storage-preview"

# Queues
[[queues.producers]]
queue = "events"
binding = "EVENT_QUEUE"

[[queues.consumers]]
queue = "events"
max_batch_size = 100      # doc 31: the ledger writes one R2 object per batch, hour and stream; small batches made thousands of objects an hour
max_batch_timeout = 3     # a scene-gen job waits at most three seconds for the batch to fill
max_concurrency = 6       # generate several novel scenes in parallel under load
max_retries = 2

# Browser Rendering — headless Chromium on Cloudflare, for visual verification (the /__shot route)
[browser]
binding = "BROWSER"

# Durable Objects
[[durable_objects.bindings]]
name = "STATE_MANAGER"
class_name = "StateManager"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "PERSONALIZATION_WEBSOCKET"
class_name = "PersonalizationWebSocket"

# Opal conversational agent (Cloudflare Agents SDK). Binding name matches the class;
# the client URL uses the kebab-case form ("opal-agent").
[[durable_objects.bindings]]
name = "OpalAgent"
class_name = "OpalAgent"

# Edge Affinity Reflex P2 (docs/architecture/16-edge-affinity-reflex.md §6):
# per-shopper hot object owning BOTH the WebSocket and the affinity state.
# Keyed on the STABLE visitor id; reached only when REFLEX_HOST = "do".
[[durable_objects.bindings]]
name = "SHOPPER_REFLEX"
class_name = "ShopperReflex"

# Meridian (Opticon surface) owns its own reflex object rather than sharing
# ShopperReflex. REFLEX_HOST is a single global var, so reaching the DO host
# through it would move Coach onto a path that has never run in production.
# Meridian always uses this object; nothing is toggled and nobody else is moved.
[[durable_objects.bindings]]
name = "MERIDIAN_REFLEX"
class_name = "MeridianReflex"

# CW6 — regional trending: one object per tenant and region holding the
# population's decaying interest vector. No visitor ids, ever. Publishes a
# snapshot to KV on a coalesced alarm; the decision path reads KV, never the object.
[[durable_objects.bindings]]
name = "REGION_TREND"
class_name = "RegionTrend"

# Phase 1 of the outcome-learning design (doc 22 §4 to §6): the visitor's ring
# with online attribution, and one statistics object per tenant, brand and slot
# that publishes lift snapshots to KV. The decision path reads KV, never these.
[[durable_objects.bindings]]
name = "DECISION_RING"
class_name = "DecisionRing"

[[durable_objects.bindings]]
name = "LEARN_STATS"
class_name = "LearnStats"

[[migrations]]
tag = "v1"
new_classes = ["StateManager", "RateLimiter"]

[[migrations]]
tag = "v2"
new_classes = ["PersonalizationWebSocket"]

# Agents SDK stores chat history in SQLite, so OpalAgent must be a SQLite-backed DO.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["OpalAgent"]

# ShopperReflex is SQLite-backed by spec (doc 16 §6): affinity state + hibernating
# WebSockets + closed-form alarms live in ctx.storage.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["ShopperReflex"]

# MeridianReflex is SQLite-backed for the same reasons: affinity state, a
# hibernating socket, and closed-form alarms all live in ctx.storage.
[[migrations]]
tag = "v5"
new_sqlite_classes = ["MeridianReflex"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["RegionTrend"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["DecisionRing", "LearnStats"]

# Analytics Engine
[[analytics_engine_datasets]]
binding = "ANALYTICS"

# D1 database — Coach demo dataset (ODP profiles + commerce + warehouse-export mirror).
# Powers the Opal chat's aggregate-then-reason query surface (v_profiles / meta_attribute_catalog).
# Apply schema + seed locally:
#   npx wrangler d1 execute coach-demo-db --local --file=migrations/0001_d1_init.sql
#   node scripts/seed-d1.mjs && npx wrangler d1 execute coach-demo-db --local --file=migrations/0002_seed_catalog.sql  (then 0003, 0004)
# At deploy time, re-run the same with --remote.
[[d1_databases]]
binding = "DB"
database_name = "coach-demo-db"
database_id = "80fcd6e1-4764-4ba2-bf95-587c3debdc73"
migrations_dir = "migrations"

# Environment Variables (use wrangler secret for sensitive values)
[vars]
ENVIRONMENT = "development"
# Who may talk to this worker (src/middleware/edgeAccess.ts). ENFORCED since
# 2026-09-03: the demo pages carry the site key `demo-site` in a <meta> and
# /edge-auth.js attaches it; the presenter signs in once on /tuning.html (email and
# password, the shared sign-in) and that covers the merchandiser's writes. The audience needs nothing.
# Requires the SDK_KEYS secret on the worker (deploy.sh refuses without it):
#   printf '*:demo-site' | wrangler secret put SDK_KEYS
# ROLLBACK IS THIS ONE LINE: set it to "open".
AUTH_MODE = "enforced"
CONNECTOR_MODE = "mock"
# Mode-B decision source: 'mock' (default — current demo) | 'optimizely' (real FX SDK + datafile).
# Independent of CONNECTOR_MODE so live decisions can be flipped on without touching segments/audiences.
DECISION_SOURCE = "mock"
# ODP REST base (NOT secret — the key is; `wrangler secret put ODP_PUBLIC_KEY`).
# Coach RTS demo instance scope 11023 (app.zaius.com); v3 endpoints: /v3/graphql, /v3/events.
ODP_API_HOST = "https://api.zaius.com"
JWT_SECRET = "development-secret-key-change-in-production"
JWT_ISSUER = "edge-platform"
JWT_AUDIENCE = "edge-platform-api"
# Optimizely FX SDK key — NOT secret (the datafile at cdn.optimizely.com/datafiles/<key>.json is public).
OPTIMIZELY_SDK_KEY = "RLCQEiLW3ifgVH5fwuHoo"
OPTIMIZELY_DATAFILE_URL = "https://cdn.optimizely.com/datafiles/RLCQEiLW3ifgVH5fwuHoo.json"
# Edge Affinity Reflex P2 host (doc 16 §6): 'session' (default — reflex state rides
# the KV session, WebSocket on the relay DO; today's behavior) | 'do' (opt-in —
# socket + state + alarms co-located in the per-shopper ShopperReflex DO).
REFLEX_HOST = "session"
# Bright Hour demo (surface 'brighthour', /live): demo-clock time compression.
# 1 = real time; e.g. 360 plays a 24h offer window in 4 minutes. Real ISO
# timestamps are preserved everywhere — only the clock scales (house honesty rule).
BRIGHTHOUR_CLOCK_MULTIPLIER = "1"
# CW6: tenants whose region snapshots the hourly cron rolls up into country and everyone.
TREND_ROLLUP_TENANTS = "coach"

# Static assets configuration
[assets]
directory = "public"
# Binding so the Worker can read its own static files server-side (e.g. /ai/scene reads the
# real product shot as the image-model reference). Self-fetch is unreliable; this is the documented way.
binding = "ASSETS"
# Serve index.html for root and handle 404s
not_found_handling = "single-page-application"

# Development settings
[dev]
port = 9100
local_protocol = "http"
ip = "localhost"

# ═════════════════════════════════════════════════════════════════════════════
# STAGING — the customer-facing lower environment (CW10, plan 21 Lane B).
#
# Every binding is declared again here against staging's OWN resources, which
# is the hard isolation from the demo worker that section 1.7 promises. Fill the
# <staging-…> placeholders with scripts/provision-staging.sh, which creates the
# resources, applies the D1 migrations, sets the secrets and seeds an operator
# login. scripts/deploy.sh refuses `--env staging` while a placeholder remains.
#
# Secrets (never here): JWT_SECRET, SDK_KEYS, GEMINI_API_KEY, and optionally
# ODP_PUBLIC_KEY, SHOT_TOKEN. Set them with `wrangler secret put NAME --env staging`.
# ═════════════════════════════════════════════════════════════════════════════
# Cron schedules (the scheduled handler in src/index.ts matches on the pattern):
#   0 * * * *  regional trend roll-up, per tenant in TREND_ROLLUP_TENANTS (doc 22 §5.2)
#   0 3 * * *  the learning cycle: proposals or bounded moves for slots in assisted / autonomous mode (doc 22 §7.3)
# Persisted, queryable logs in the dashboard for every environment (src/ops/monitor.ts writes one line per run).
[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/5 * * * *", "0 * * * *", "0 3 * * *"]   # the monitor every five minutes; the trend rollup hourly; the day report, the autonomy cycle and the erasure rewrite at 03:00 UTC

[env.staging]
name = "edge-platform-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
# Enforced: SDK keys on /realtime and /v1, JWT on operator writes, CORS allow-list only.
AUTH_MODE = "enforced"
# The customer's lower-environment origins, comma-separated (`*.example.com` allowed).
# Empty means the worker answers only same-origin callers and the local dev server.
CORS_ORIGINS = ""
CONNECTOR_MODE = "mock"
DECISION_SOURCE = "mock"
ODP_API_HOST = "https://api.zaius.com"
JWT_ISSUER = "edge-platform-staging"
JWT_AUDIENCE = "edge-platform-api"
OPTIMIZELY_SDK_KEY = "RLCQEiLW3ifgVH5fwuHoo"
OPTIMIZELY_DATAFILE_URL = "https://cdn.optimizely.com/datafiles/RLCQEiLW3ifgVH5fwuHoo.json"
REFLEX_HOST = "session"   # 2026-09-05 load test (doc 31): the session host writes KV on every request, 580 to 720 ms per decision; the object host is faster but its ingest refuses the content events and the stage never reaches the cell, so the loop is wrong there. Session until the object host passes the acceptance run.
BRIGHTHOUR_CLOCK_MULTIPLIER = "1"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "9c963380bedb434aa511e35bc9924c00"

[[env.staging.kv_namespaces]]
